<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Time</title>
    <style>
        /* Basic styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            transition: all 0.3s ease;
        }

        /* 背景层 - 用于显示用户上传的背景图片 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5; /* 默认浅色背景 */
            z-index: -2;
            transition: filter 0.3s ease, background-color 0.3s ease;
        }

        /* 深色主题时背景层为深色 */
        .dark .bg-layer {
            background-color: #1a1a1a;
        }

        /* 内容遮罩层 - 提高文字可读性 */
        .content-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
        }

        /* 模糊状态 */
        .bg-layer.blurred {
            filter: blur(10px);
        }

        #date {
            font-size: 6vw;
            font-weight: 300;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        #clock {
            font-size: 18vw;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Light mode */
        .light {
            color: #1a1a1a;
        }

        /* Dark mode */
        .dark {
            color: #f5f5f5;
        }

        /* 右侧控制按钮容器 - 使用 flex 布局防止重叠 */
        .controls-right {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* 控制按钮通用样式 */
        .control-btn {
            height: 1.5rem;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            background-color: rgba(224, 224, 224, 0.8);
            font-size: 0.8rem;
            padding: 0 0.8rem;
            color: #333;
            white-space: nowrap;
        }

        .dark .control-btn {
            background-color: rgba(51, 51, 51, 0.8);
            color: #f5f5f5;
        }

        #theme-toggle {
            width: 3rem;
            padding: 0;
        }

        /* AM/PM small font style */
        .ampm {
            font-size: 6vw;
            vertical-align: super;
        }

        /* Browser check button style */
        #browser-check {
            position: absolute;
            top: 1rem;
            width: 8rem;
            height: 1.5rem;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            background-color: rgba(224, 224, 224, 0.8);
            left: 1rem;
            font-size: 0.8rem;
            color: #333;
        }

        .dark #browser-check {
            background-color: rgba(51, 51, 51, 0.8);
            color: #f5f5f5;
        }

        /* Modal popup style - 适配主题 */
        #browser-check-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            color: #1a1a1a;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        /* 深色主题时弹窗为深色 */
        .dark #browser-check-modal {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        /* 弹窗内关闭按钮适配主题 */
        #close-modal {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
        }

        .dark #close-modal {
            background-color: #333;
            color: #f5f5f5;
        }

        /* Modal overlay style */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* 隐藏的文件输入 */
        #bg-file-input {
            display: none;
        }
    </style>
</head>
<body class="light">
    <!-- 背景层 -->
    <div class="bg-layer" id="bg-layer"></div>
    <!-- 内容遮罩层 -->
    <div class="content-overlay" id="content-overlay"></div>

    <!-- Date display container -->
    <div id="date"></div>
    <div id="clock">00:00:00</div>

    <!-- 右侧控制按钮容器 -->
    <div class="controls-right">
        <button class="control-btn" id="hour-format-toggle">24H</button>
        <button class="control-btn" id="theme-toggle">🌙</button>
        <button class="control-btn" id="bg-upload-btn">🖼️ 背景</button>
        <button class="control-btn" id="bg-clear-btn">🗑️ 清除</button>
        <button class="control-btn" id="blur-toggle">模糊: 关</button>
    </div>

    <!-- 隐藏的文件上传输入 -->
    <input type="file" id="bg-file-input" accept="image/*">

    <!-- Browser check button -->
    <button id="browser-check">浏览器检查</button>

    <!-- Modal structure -->
    <div id="modal-overlay"></div>
    <div id="browser-check-modal">
        <div style="text-align: center;">
            <div id="test-results"></div>
            <button id="close-modal">关闭</button>
        </div>
    </div>

    <script>
        // Variable to store hour format state (true = 24-hour format, false = 12-hour format)
        var is24HourFormat = true;
        // 高斯模糊状态
        var isBlurred = false;
        // 是否使用自动适应背景颜色
        var autoAdapt = true;

        // Function to pad numbers with leading zeros
        function padZero(num) {
            return (num < 10 ? '0' : '') + num;
        }

        // Function to update the date display
        function updateDate() {
            var now = new Date();
            var year = now.getFullYear();
            var month = padZero(now.getMonth() + 1);
            var day = padZero(now.getDate());

            var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            var weekday = '星期' + weekdays[now.getDay()];

            document.getElementById('date').innerHTML = 
                year + '-' + month + '-' + day + ' ' + weekday;
        }

        // Function to update the clock display
        function updateClock() {
            updateDate();

            var now = new Date();
            var hours = now.getHours();
            var minutes = padZero(now.getMinutes());
            var seconds = padZero(now.getSeconds());
            var ampm = '';

            if (!is24HourFormat) {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12 || 12;
            }

            hours = is24HourFormat ? padZero(hours) : hours;

            document.getElementById('clock').innerHTML = 
                hours + ':' + minutes + ':' + seconds + 
                (ampm ? '<span class="ampm">' + ampm + '</span>' : '');
        }

        // Function to toggle theme
        function toggleTheme() {
            var body = document.body;
            var isDark = body.classList.contains('dark');
            var button = document.getElementById('theme-toggle');

            body.className = isDark ? 'light' : 'dark';
            button.innerHTML = isDark ? '🌙' : '☀️';

            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Function to toggle hour format
        function toggleHourFormat() {
            is24HourFormat = !is24HourFormat;
            document.getElementById('hour-format-toggle').innerHTML = is24HourFormat ? '24H' : '12H';
            localStorage.setItem('hourFormat', is24HourFormat ? '24' : '12');
            updateClock();
        }

        // 分析图片颜色，自动调整文字颜色和遮罩
        function analyzeBackgroundColor(imageUrl) {
            var img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                try {
                    // 创建 Canvas 读取像素
                    var canvas = document.createElement('canvas');
                    var size = 50; // 缩小到 50x50 提高性能
                    canvas.width = size;
                    canvas.height = size;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    var imageData = ctx.getImageData(0, 0, size, size);
                    var pixels = imageData.data;
                    
                    // 随机选取 10 个点
                    var darkCount = 0;
                    var lightCount = 0;
                    var totalBrightness = 0;
                    
                    for (var i = 0; i < 10; i++) {
                        var idx = Math.floor(Math.random() * (size * size)) * 4;
                        var r = pixels[idx];
                        var g = pixels[idx + 1];
                        var b = pixels[idx + 2];
                        var a = pixels[idx + 3];
                        
                        // 跳过透明像素
                        if (a < 128) continue;
                        
                        // 计算亮度（加权公式）
                        var brightness = (0.299 * r + 0.587 * g + 0.114 * b);
                        totalBrightness += brightness;
                        
                        if (brightness < 128) {
                            darkCount++;
                        } else {
                            lightCount++;
                        }
                    }
                    
                    var avgBrightness = totalBrightness / 10;
                    
                    // 根据背景亮度调整文字颜色和遮罩
                    var body = document.body;
                    var overlay = document.getElementById('content-overlay');
                    
                    if (avgBrightness < 128) {
                        // 背景偏暗 → 文字用浅色
                        body.classList.remove('light');
                        body.classList.add('dark');
                        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.2)';
                    } else {
                        // 背景偏亮 → 文字用深色
                        body.classList.remove('dark');
                        body.classList.add('light');
                        overlay.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                    }
                } catch (err) {
                    console.log('背景颜色分析失败:', err);
                }
            };
            img.src = imageUrl;
        }

        // 上传背景图片
        function handleBgUpload(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var bgUrl = e.target.result;
                var bgLayer = document.getElementById('bg-layer');
                bgLayer.style.backgroundImage = 'url(' + bgUrl + ')';
                
                // 保存到 localStorage（注意：大图片可能超出 localStorage 限制）
                try {
                    localStorage.setItem('bgImage', bgUrl);
                } catch (err) {
                    console.log('背景图片过大，无法保存到本地存储');
                }
                
                // 自动分析背景颜色并调整文字
                if (autoAdapt) {
                    analyzeBackgroundColor(bgUrl);
                }
            };
            reader.readAsDataURL(file);
        }

        // 清除背景图片
        function clearBackground() {
            var bgLayer = document.getElementById('bg-layer');
            bgLayer.style.backgroundImage = 'none';
            
            // 清除 localStorage 中的背景
            localStorage.removeItem('bgImage');
            
            // 同时关闭模糊
            if (isBlurred) {
                isBlurred = false;
                bgLayer.classList.remove('blurred');
                document.getElementById('blur-toggle').innerHTML = '模糊: 关';
                localStorage.setItem('blur', 'off');
            }
            
            // 恢复默认遮罩
            document.getElementById('content-overlay').style.backgroundColor = 'rgba(0, 0, 0, 0.3)';
            
            // 恢复主题（背景层颜色会跟随主题自动变化）
            initTheme();
        }

        // 切换高斯模糊
        function toggleBlur() {
            isBlurred = !isBlurred;
            var bgLayer = document.getElementById('bg-layer');
            var button = document.getElementById('blur-toggle');
            
            if (isBlurred) {
                bgLayer.classList.add('blurred');
                button.innerHTML = '模糊: 开';
            } else {
                bgLayer.classList.remove('blurred');
                button.innerHTML = '模糊: 关';
            }
            
            localStorage.setItem('blur', isBlurred ? 'on' : 'off');
        }

        // 初始化背景
        function initBackground() {
            var savedBg = localStorage.getItem('bgImage');
            if (savedBg) {
                var bgLayer = document.getElementById('bg-layer');
                bgLayer.style.backgroundImage = 'url(' + savedBg + ')';
                
                // 分析保存的背景颜色
                if (autoAdapt) {
                    analyzeBackgroundColor(savedBg);
                }
            }

            // 初始化模糊状态
            var savedBlur = localStorage.getItem('blur');
            if (savedBlur === 'on') {
                isBlurred = true;
                document.getElementById('bg-layer').classList.add('blurred');
                document.getElementById('blur-toggle').innerHTML = '模糊: 开';
            }
        }

        // Function to initialize theme
        function initTheme() {
            var savedTheme = localStorage.getItem('theme') || 'light';
            document.body.className = savedTheme;

            var button = document.getElementById('theme-toggle');
            button.innerHTML = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        // Function to initialize hour format
        function initHourFormat() {
            var savedFormat = localStorage.getItem('hourFormat');
            if (savedFormat) {
                is24HourFormat = (savedFormat === '24');
            }
            document.getElementById('hour-format-toggle').innerHTML = is24HourFormat ? '24H' : '12H';
        }

        // Function to initialize event listeners
        function initEvent() {
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('hour-format-toggle').addEventListener('click', toggleHourFormat);
            
            // 背景上传按钮
            document.getElementById('bg-upload-btn').addEventListener('click', function() {
                document.getElementById('bg-file-input').click();
            });
            
            // 文件选择事件
            document.getElementById('bg-file-input').addEventListener('change', handleBgUpload);
            
            // 清除背景按钮
            document.getElementById('bg-clear-btn').addEventListener('click', clearBackground);
            
            // 模糊开关
            document.getElementById('blur-toggle').addEventListener('click', toggleBlur);
        }

        // Browser check button event listener
        document.getElementById('browser-check').addEventListener('click', function() {
            var modal = document.getElementById('browser-check-modal');
            var overlay = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            overlay.style.display = 'block';

            testBrowserComponents();
        });

        // Close modal on overlay click
        document.getElementById('modal-overlay').addEventListener('click', function() {
            var modal = document.getElementById('browser-check-modal');
            var overlay = document.getElementById('modal-overlay');
            modal.style.display = 'none';
            overlay.style.display = 'none';
        });

        // Close modal on button click
        document.getElementById('close-modal').addEventListener('click', function() {
            var modal = document.getElementById('browser-check-modal');
            var overlay = document.getElementById('modal-overlay');
            modal.style.display = 'none';
            overlay.style.display = 'none';

            var testResultsContainer = document.getElementById('test-results');
            testResultsContainer.innerHTML = '';
        });

        // Detect browser name and version
        function getBrowserInfo() {
            var userAgent = navigator.userAgent;
            var browserName = "未知浏览器";
            var browserVersion = "未知版本";

            if (/chrome|chromium|crios/i.test(userAgent)) {
                browserName = "Chrome";
                browserVersion = userAgent.match(/(?:chrome|chromium|crios)\/(\d+)/i)[1];
            } else if (/firefox|fxios/i.test(userAgent)) {
                browserName = "Firefox";
                browserVersion = userAgent.match(/(?:firefox|fxios)\/(\d+)/i)[1];
            } else if (/safari/i.test(userAgent) && !/chrome|chromium|crios/i.test(userAgent)) {
                browserName = "Safari";
                browserVersion = userAgent.match(/version\/(\d+)/i)[1];
            } else if (/edge/i.test(userAgent)) {
                browserName = "Edge";
                browserVersion = userAgent.match(/edge\/(\d+)/i)[1];
            } else if (/opera|opr/i.test(userAgent)) {
                browserName = "Opera";
                browserVersion = userAgent.match(/(?:opera|opr)\/(\d+)/i)[1];
            }

            return { name: browserName, version: browserVersion };
        }

        // Test browser capabilities
        function testBrowserComponents() {
            var results = [];

            var browserInfo = getBrowserInfo();
            results.push("浏览器类型: " + browserInfo.name);
            results.push("浏览器版本: " + browserInfo.version);

            try {
                var resizeSupported = false;
                window.addEventListener('resize', function() {
                    resizeSupported = true;
                });
                
                var originalWidth = window.innerWidth;
                window.innerWidth = originalWidth - 1;
                window.dispatchEvent(new Event('resize'));
                window.innerWidth = originalWidth;
                
                results.push("窗口调整事件支持: " + (resizeSupported ? "是" : "否"));
                
                if (window.matchMedia) {
                    var mediaQuery = window.matchMedia('(min-width: 500px)');
                    results.push("媒体查询支持: 是");
                } else {
                    results.push("媒体查询支持: 否");
                }
            } catch (e) {
                results.push("自适应检测: 错误 - " + e.message);
            }

            try {
                if (typeof localStorage !== 'undefined') {
                    results.push("用户配置存储: 可用");
                } else {
                    results.push("用户配置存储: 不可用");
                }
            } catch (e) {
                results.push("用户配置存储: 错误 - " + e.message);
            }

            var testResultsContainer = document.getElementById('test-results');
            testResultsContainer.innerHTML = "<h3>测试结果：</h3>" + results.join("<br>");
        }

        // Page load initialization
        window.addEventListener('load', function() {
            initTheme();
            initHourFormat();
            initBackground();
            initEvent();
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaDial Classic</title>
    <style>
        /* Basic styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            transition: all 0.3s ease;
        }

        #date {
            font-size: 6vw;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        #clock {
            font-size: 18vw;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        /* Light mode */
        .light {
            background-color: #f5f5f5;
            color: #1a1a1a;
        }

        /* Dark mode */
        .dark {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        #theme-toggle, #hour-format-toggle {
            position: absolute;
            top: 1rem;
            width: 3rem;
            height: 1.5rem;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            background-color: #e0e0e0;
        }

        /* Adjust button positions */
        #theme-toggle {
            right: 1rem;
        }
        #hour-format-toggle {
            right: 4.5rem; /* Left of the dark mode button */
        }

        /* Dark mode button style */
        .dark #theme-toggle {
            background-color: #333; /* Dark gray background */
        }

        /* AM/PM small font style */
        .ampm {
            font-size: 6vw;  /* Half the original size */
            vertical-align: super; /* Slightly move up for alignment */
        }

        /* Browser check button style */
        #browser-check {
            position: absolute;
            top: 1rem;
            width: 8rem; /* Increase width to accommodate five Chinese characters */
            height: 1.5rem;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            background-color: #e0e0e0;
            left: 1rem; /* Place at the far left */
        }

        /* Modal popup style */
        #browser-check-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        /* Modal overlay style */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body class="light">
    <!-- Date display container -->
    <div id="date"></div>
    <div id="clock">00:00:00</div>
    <!-- Hour format toggle button -->
    <button id="hour-format-toggle">24H</button>
    <button id="theme-toggle">🌙</button>

    <!-- Browser check button -->
    <button id="browser-check">浏览器检查</button>

    <!-- Modal structure -->
    <div id="modal-overlay"></div>
    <div id="browser-check-modal">
        <div style="text-align: center;">
            <!-- Container for test results -->
            <div id="test-results"></div>
            <button id="close-modal">关闭</button>
        </div>
    </div>

    <script>
        // Variable to store hour format state (true = 24-hour format, false = 12-hour format)
        var is24HourFormat = true;

        // Function to pad numbers with leading zeros
        function padZero(num) {
            return (num < 10 ? '0' : '') + num;
        }

        // Function to update the date display
        function updateDate() {
            var now = new Date();
            var year = now.getFullYear();
            var month = padZero(now.getMonth() + 1);
            var day = padZero(now.getDate());

            // Weekday mapping table
            var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            var weekday = '星期' + weekdays[now.getDay()];

            document.getElementById('date').innerHTML = 
                year + '-' + month + '-' + day + ' ' + weekday;
        }

        // Function to update the clock display - supports 12/24-hour format toggling
        function updateClock() {
            updateDate();

            var now = new Date();
            var hours = now.getHours();
            var minutes = padZero(now.getMinutes());
            var seconds = padZero(now.getSeconds());
            var ampm = '';

            // Handle 12-hour format
            if (!is24HourFormat) {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12 || 12; // Convert 0 to 12
            }

            // Keep 24-hour format as two digits
            hours = is24HourFormat ? padZero(hours) : hours;

            // Wrap AM/PM in a span tag to apply reduced styling
            document.getElementById('clock').innerHTML = 
                hours + ':' + minutes + ':' + seconds + 
                (ampm ? '<span class="ampm">' + ampm + '</span>' : '');
        }

        // Function to toggle theme - updates button state
        function toggleTheme() {
            var body = document.body;
            var isDark = body.classList.contains('dark');
            var button = document.getElementById('theme-toggle');

            // Toggle class names
            body.className = isDark ? 'light' : 'dark';

            // Update button content
            button.innerHTML = isDark ? '🌙' : '☀️';

            // Save theme state
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Function to toggle hour format
        function toggleHourFormat() {
            is24HourFormat = !is24HourFormat;
            // Update button text
            document.getElementById('hour-format-toggle').innerHTML = is24HourFormat ? '24H' : '12H';
            // Save state
            localStorage.setItem('hourFormat', is24HourFormat ? '24' : '12');
            // Immediately update time display
            updateClock();
        }

        // Function to initialize theme - sets button state
        function initTheme() {
            var savedTheme = localStorage.getItem('theme') || 'light';
            document.body.className = savedTheme;

            // Initialize button state
            var button = document.getElementById('theme-toggle');
            button.innerHTML = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        // Function to initialize hour format
        function initHourFormat() {
            var savedFormat = localStorage.getItem('hourFormat');
            if (savedFormat) {
                is24HourFormat = (savedFormat === '24');
            }
            // Set button initial state
            document.getElementById('hour-format-toggle').innerHTML = is24HourFormat ? '24H' : '12H';
        }

        // Function to initialize event listeners - adds hour format button listener
        function initEvent() {
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            // Add hour format button listener
            document.getElementById('hour-format-toggle').addEventListener('click', toggleHourFormat);
        }

        // Browser check button event listener
        document.getElementById('browser-check').addEventListener('click', function() {
            var modal = document.getElementById('browser-check-modal');
            var overlay = document.getElementById('modal-overlay');
            modal.style.display = 'block';
            overlay.style.display = 'block';

            // Automatically test critical components or functions
            testBrowserComponents();
        });

        // Close modal on overlay click
        document.getElementById('modal-overlay').addEventListener('click', function() {
            var modal = document.getElementById('browser-check-modal');
            var overlay = document.getElementById('modal-overlay');
            modal.style.display = 'none';
            overlay.style.display = 'none';
        });

        // Close modal on button click
        document.getElementById('close-modal').addEventListener('click', function() {
            var modal = document.getElementById('browser-check-modal');
            var overlay = document.getElementById('modal-overlay');
            modal.style.display = 'none';
            overlay.style.display = 'none';

            // Clear content of test results container
            var testResultsContainer = document.getElementById('test-results');
            testResultsContainer.innerHTML = '';
        });

        // Detect browser name and version
        function getBrowserInfo() {
            var userAgent = navigator.userAgent;
            var browserName = "未知浏览器";
            var browserVersion = "未知版本";

            if (/chrome|chromium|crios/i.test(userAgent)) {
                browserName = "Chrome";
                browserVersion = userAgent.match(/(?:chrome|chromium|crios)\/(\d+)/i)[1];
            } else if (/firefox|fxios/i.test(userAgent)) {
                browserName = "Firefox";
                browserVersion = userAgent.match(/(?:firefox|fxios)\/(\d+)/i)[1];
            } else if (/safari/i.test(userAgent) && !/chrome|chromium|crios/i.test(userAgent)) {
                browserName = "Safari";
                browserVersion = userAgent.match(/version\/(\d+)/i)[1];
            } else if (/edge/i.test(userAgent)) {
                browserName = "Edge";
                browserVersion = userAgent.match(/edge\/(\d+)/i)[1];
            } else if (/opera|opr/i.test(userAgent)) {
                browserName = "Opera";
                browserVersion = userAgent.match(/(?:opera|opr)\/(\d+)/i)[1];
            }

            return { name: browserName, version: browserVersion };
        }

        // Test browser capabilities
        function testBrowserComponents() {
            var results = [];

            // Detect browser type and version
            var browserInfo = getBrowserInfo();
            results.push("浏览器类型: " + browserInfo.name);
            results.push("浏览器版本: " + browserInfo.version);

            try {
                // 检测窗口大小变化事件支持
                var resizeSupported = false;
                window.addEventListener('resize', function() {
                    resizeSupported = true;
                });
                
                // 触发测试性窗口大小变化
                var originalWidth = window.innerWidth;
                window.innerWidth = originalWidth - 1;
                window.dispatchEvent(new Event('resize'));
                window.innerWidth = originalWidth;
                
                results.push("窗口调整事件支持: " + (resizeSupported ? "是" : "否"));
                
                // 检测媒体查询支持
                if (window.matchMedia) {
                    var mediaQuery = window.matchMedia('(min-width: 500px)');
                    results.push("媒体查询支持: 是");
                } else {
                    results.push("媒体查询支持: 否");
                }
            } catch (e) {
                results.push("自适应检测: 错误 - " + e.message);
            }

            try {
                if (typeof localStorage !== 'undefined') {
                    results.push("用户配置存储: 可用");
                } else {
                    results.push("用户配置存储: 不可用");
                }
            } catch (e) {
                results.push("用户配置存储: 错误 - " + e.message);
            }

            // Display results in container
            var testResultsContainer = document.getElementById('test-results');
            testResultsContainer.innerHTML = "<h3>测试结果：</h3>" + results.join("<br>");
        }

        // Page load initialization - includes hour format initialization
        window.addEventListener('load', function() {
            initTheme();
            initHourFormat();  // Initialize hour format
            initEvent();
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
